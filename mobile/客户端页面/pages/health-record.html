<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0,user-scalable=no,minimal-ui">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../img/icon01.png">
    <title>健康档案 - 医疗管家</title>
    <link rel="stylesheet" href="../css/page-health-record.css" />
    <script src="../plugins/jquery/dist/jquery.min.js"></script>
    <script src="../plugins/healthmobile.js"></script>
</head>
<body data-spy="scroll" data-target="#myNavbar" data-offset="150">
<div class="app">
    <!-- 页面头部 -->
    <div class="top-header">
        <span class="f-left"><i class="icon-back" onclick="history.go(-1)"></i></span>
        <span class="center">健康档案</span>
        <span class="f-right"><i class="icon-more"></i></span>
    </div>
    
    <!-- 健康档案功能入口 -->
    <div class="text-link">
        <ul class="list-box">
            <li>
                <a href="health-recordDetail.html?type=basic" class="link-page">
                    <i class="icon-baseinfo"></i>
                    <span>基本信息</span>
                </a>
            </li>
            <li>
                <a href="health-recordDetail.html?type=case" class="link-page">
                    <i class="icon-case"></i>
                    <span>病史记录</span>
                </a>
            </li>
            <li>
                <a href="health-recordDetail.html?type=allergy" class="link-page">
                    <i class="icon-allergy"></i>
                    <span>过敏信息</span>
                </a>
            </li>
            <li>
                <a href="health-recordDetail.html?type=family" class="link-page">
                    <i class="icon-family"></i>
                    <span>家族病史</span>
                </a>
            </li>
            <li>
                <a href="health-recordDetail.html?type=checkup" class="link-page">
                    <i class="icon-search"></i>
                    <span>体检记录</span>
                </a>
            </li>
            <li>
                <a href="health-recordDetail.html?type=medication" class="link-page">
                    <i class="icon-tizhi"></i>
                    <span>用药记录</span>
                </a>
            </li>
        </ul>
    </div>
    
    <!-- 健康档案概览 -->
    <div style="padding: 15px; background-color: #fff; margin-top: 10px;">
        <h3 style="font-size: 16px; color: #333; margin-bottom: 15px;">健康档案概览</h3>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <div style="text-align: center; flex: 1;">
                <div style="font-size: 24px; color: #038bdf; font-weight: bold;">3</div>
                <div style="font-size: 12px; color: #666;">体检记录</div>
            </div>
            <div style="text-align: center; flex: 1;">
                <div style="font-size: 24px; color: #ff9800; font-weight: bold;">2</div>
                <div style="font-size: 12px; color: #666;">病史记录</div>
            </div>
            <div style="text-align: center; flex: 1;">
                <div style="font-size: 24px; color: #4caf50; font-weight: bold;">5</div>
                <div style="font-size: 12px; color: #666;">用药记录</div>
            </div>
        </div>
        <div style="background-color: #f8f9fa; padding: 15px; border-radius: 8px;">
            <p style="font-size: 14px; color: #333; margin-bottom: 10px;">最近更新：2026-07-05</p>
            <p style="font-size: 12px; color: #666;">您的健康档案已更新，包含最新的体检结果和病史信息。</p>
        </div>
    </div>
</div>

<script>
$(function() {
    // 检查登录状态
    var userId = localStorage.getItem('userId');
    if (!userId) {
        if (confirm('请先登录后再查看健康档案')) {
            window.location.href = 'login.html';
        }
    }
    
    // 加载健康档案数据
    loadHealthRecordData();
});

// 加载健康档案数据
function loadHealthRecordData() {
    // 从本地存储加载数据
    var basicData = JSON.parse(localStorage.getItem('basicData') || '{}');
    var caseData = JSON.parse(localStorage.getItem('caseData') || '[]');
    var allergyData = JSON.parse(localStorage.getItem('allergyData') || '[]');
    var familyData = JSON.parse(localStorage.getItem('familyData') || '[]');
    var checkupData = JSON.parse(localStorage.getItem('checkupData') || '[]');
    var medicationData = JSON.parse(localStorage.getItem('medicationData') || '[]');
    
    // 更新概览统计
    var checkupCount = checkupData.length || 3;
    var caseCount = caseData.length || 2;
    var medicationCount = medicationData.length || 5;
    
    $('div[style*="font-size: 24px; color: #038bdf"]').text(checkupCount);
    $('div[style*="font-size: 24px; color: #ff9800"]').text(caseCount);
    $('div[style*="font-size: 24px; color: #4caf50"]').text(medicationCount);
    
    console.log('加载健康档案数据:', { basicData, caseData, allergyData, familyData, checkupData, medicationData });
}
</script>
</body>
</html>
