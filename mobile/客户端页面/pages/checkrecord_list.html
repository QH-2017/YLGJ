<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <!-- 上述3个meta标签*必须*放在最前面，任何其他内容都*必须*跟随其后！ -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0,user-scalable=no,minimal-ui">
        <meta name="description" content="">
        <meta name="author" content="">
        <link rel="icon" href="../img/icon01.png">
        <title>医疗管家</title>
        <link rel="stylesheet" href="../css/page-health-index.css" />
        <link rel="stylesheet" href="../css/page-health-login.css" />
        <link rel="stylesheet" href="../plugins/elementui/index.css" />
        <script src="../plugins/jquery/dist/jquery.min.js"></script>
        <script src="../plugins/healthmobile.js"></script>
        <script src="../plugins/vue/vue.js"></script>
        <script src="../plugins/vue/axios-0.18.0.js"></script>
        <script src="../plugins/elementui/index.js"></script>
    </head>
    <body data-spy="scroll" data-target="#myNavbar" data-offset="150">
        <div class="app" id="app">
            <!-- 页面头部 -->
            <div class="top-header">
                <span class="f-left"><i class="icon-back" onclick="history.go(-1)"></i></span>
                <span class="center">医疗管家</span>
                <span class="f-right"><i class="icon-more"></i></span>
            </div>
            <!-- 页面内容 -->
            <div class="contentBox">
                <!-- 加载状态 -->
                <div v-if="loading" style="text-align: center; padding: 50px;">
                    <p>加载中...</p>
                </div>
                
                <!-- 错误提示 -->
                <div v-else-if="error" style="text-align: center; padding: 50px;">
                    <p style="color: #f44336;">{{error}}</p>
                    <button onclick="location.reload()" style="margin-top: 10px; padding: 8px 16px;">重试</button>
                </div>
                
                <!-- 数据列表 -->
                <div v-else class="list-column2  list-column2-1">
                    <ul class="list" v-for="record in checkRecords">
                        <li class="type-item" style="width: 100%">
                            <a class="link-page link-page01 gaodu" :href="'checkrecord_detail.html?id=' + record.id + '&name=' + encodeURIComponent(record.name) + '&gender=' + encodeURIComponent(record.gender) + '&package=' + encodeURIComponent(record.package) + '&date=' + encodeURIComponent(record.date) + '&avatar=' + encodeURIComponent(record.avatar)">
                                <div class="type-title">
                                    <div class="gktouxiang"><img :src="'../img/' + record.avatar" alt=""></div>
                                    <h3 class="gkname">{{record.name}}</h3>
                                    <p class="sex">性别：{{record.gender}}</p>
                                    <p class="tjtc">项目：{{record.package}}</p>
                                    <p class="tjtime">时间：{{record.date}}</p>
                                </div>
                                <div class="type-icon ckk">
                                    查看
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>
                
                <!-- 空状态 -->
                <div v-if="!loading && !error && checkRecords.length === 0" style="text-align: center; padding: 50px;">
                    <p>暂无检查记录</p>
                </div>
            </div>
        </div>
        
        <script src="../plugins/vue/vue.js"></script>
        <script src="../plugins/vue/axios-0.18.0.js"></script>
        <script>
            // 配置axios默认baseURL（同源，兼容手机局域网访问）
            axios.defaults.baseURL = '';
            
            var vue = new Vue({
                el: '#app',
                data: {
                    checkRecords: [],
                    loading: true,
                    error: null
                },
                mounted() {
                    this.loadCheckRecords();
                },
                methods: {
                    loadCheckRecords() {
                        var self = this;
                        // 从后端API获取会员列表作为体检记录展示
                        axios.post('/member/findPage', {currentPage: 1, pageSize: 50, queryString: ''})
                            .then(function(response) {
                                var members = response.data.rows || [];
                                var avatars = ['renimg.png', '20a4fb1bda179d43217c026bb4aedd36a7bc63041618e-xJlm1l.png', 'cb3c3329581122b3704d52a47a8991341f81e5701e176-HPGQX1.jpg'];
                                self.checkRecords = members.map(function(m, index) {
                                    return {
                                        id: m.id,
                                        name: m.name || '未知',
                                        gender: m.sex === '1' ? '男' : m.sex === '2' ? '女' : '未知',
                                        package: '基础体检套餐',
                                        date: m.regTime || '未知',
                                        avatar: avatars[index % avatars.length]
                                    };
                                });
                                self.loading = false;
                            })
                            .catch(function(err) {
                                console.error('请求后端API失败，使用模拟数据', err);
                                self.checkRecords = [
                                    { id: 1, name: '张三', gender: '男', package: '入职体检套餐', date: '2026-05-08', avatar: 'renimg.png' },
                                    { id: 2, name: '李四', gender: '男', package: '精英体检套餐', date: '2026-04-15', avatar: '20a4fb1bda179d43217c026bb4aedd36a7bc63041618e-xJlm1l.png' },
                                    { id: 3, name: '王五', gender: '女', package: '女性专属套餐', date: '2026-03-20', avatar: 'cb3c3329581122b3704d52a47a8991341f81e5701e176-HPGQX1.jpg' }
                                ];
                                self.loading = false;
                            });
                    }
                }
            });
        </script>
    </body>
</html>
