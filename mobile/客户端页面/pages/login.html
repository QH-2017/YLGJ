<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0,user-scalable=no,minimal-ui">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../img/icon01.png">
    <title>登录 - 医疗管家</title>
    <link rel="stylesheet" href="../css/page-health-login.css" />
    <script src="../plugins/jquery/dist/jquery.min.js"></script>
    <script src="../plugins/healthmobile.js"></script>
</head>
<body data-spy="scroll" data-target="#myNavbar" data-offset="150">
<div class="app">
    <!-- 页面头部 -->
    <div class="top-header">
        <span class="f-left"><i class="icon-back" onclick="history.go(-1)"></i></span>
        <span class="center">医疗管家</span>
        <span class="f-right"><i class="icon-more"></i></span>
    </div>
    
    <!-- 登录表单 -->
    <div class="login">
        <form id="login-form">
            <div class="input-row">
                <label>账号</label>
                <div class="loginInput">
                    <input type="text" id="account" placeholder="请输入手机号/用户名" required>
                </div>
            </div>
            <div class="input-row">
                <label>密码</label>
                <div class="loginInput">
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
            </div>
            <div class="input-row">
                <label>验证码</label>
                <div class="loginInput">
                    <input type="text" id="captcha" placeholder="请输入验证码" required style="width: 45%;">
                    <canvas id="captchaCanvas" width="120" height="40" style="width: 45%; height: 40px; float: right; border-radius: 4px; cursor: pointer; background: #f0f0f0;"></canvas>
                </div>
            </div>
            <div class="btn yes-btn">
                <a href="javascript:void(0)" id="loginBtn">登 录</a>
            </div>
            <div class="btn cancel-btn" style="margin-top: 2.7%;">
                <a href="javascript:void(0)" id="registerBtn">注 册</a>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <a href="javascript:void(0)" style="color: #57b3ec; font-size: 14px;">忘记密码？</a>
            </div>
            <div style="margin-top: 30px; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
                <p style="font-size: 13px; color: #666; margin-bottom: 8px;">📋 测试账号（密码统一为 123456）：</p>
                <p style="font-size: 12px; color: #999; line-height: 1.8;">admin / 123456（管理员）<br>zhangsan / 123456（张三）<br>13800138000 / 123456（手机号登录）</p>
            </div>
        </form>
    </div>
</div>

<script>
// 预设测试账号
var testAccounts = [
    { username: 'admin', password: '123456', name: '管理员', role: 'admin' },
    { username: 'zhangsan', password: '123456', name: '张三', role: 'user' },
    { username: '13800138000', password: '123456', name: '李四', role: 'user' }
];

$(function() {
    // 登录按钮点击事件
    $('#loginBtn').click(function() {
        var account = $('#account').val().trim();
        var password = $('#password').val().trim();
        var captcha = $('#captcha').val().trim();
        
        // 简单的表单验证
        if (!account) {
            alert('请输入账号');
            return;
        }
        if (!password) {
            alert('请输入密码');
            return;
        }
        if (!captcha) {
            alert('请输入验证码');
            return;
        }
        
        // 模拟登录验证
        var loginSuccess = false;
        var loginUser = null;
        
        for (var i = 0; i < testAccounts.length; i++) {
            if (testAccounts[i].username === account && testAccounts[i].password === password) {
                loginSuccess = true;
                loginUser = testAccounts[i];
                break;
            }
        }
        
        if (loginSuccess) {
            // 保存登录信息到本地存储
            localStorage.setItem('userId', account);
            localStorage.setItem('userName', loginUser.name);
            localStorage.setItem('userRole', loginUser.role);
            
            alert('登录成功！欢迎 ' + loginUser.name);
            window.location.href = 'index.html';
        } else {
            alert('账号或密码错误！\n\n提示：\n账号: admin, 密码: 123456\n账号: zhangsan, 密码: 123456\n账号: 13800138000, 密码: 123456');
        }
    });
    
    // 注册按钮点击事件
    $('#registerBtn').click(function() {
        alert('注册功能开发中...');
    });
    
    // 生成验证码
    function generateCaptcha() {
        var canvas = document.getElementById('captchaCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var chars = 'ABCDEFGHJKMNPQRSTWXYZabcdefhjkmnprstwxyz2345678';
        var captchaText = '';
        for (var i = 0; i < 4; i++) {
            captchaText += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        window.captchaCode = captchaText;
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, 120, 40);
        for (var i = 0; i < 4; i++) {
            ctx.font = Math.floor(Math.random() * 10 + 20) + 'px Arial';
            ctx.fillStyle = 'rgb(' + Math.floor(Math.random()*100+50) + ',' + Math.floor(Math.random()*100+50) + ',' + Math.floor(Math.random()*100+50) + ')';
            ctx.fillText(captchaText[i], 10 + i * 28, Math.floor(Math.random() * 10 + 28));
        }
        for (var i = 0; i < 5; i++) {
            ctx.strokeStyle = 'rgb(' + Math.floor(Math.random()*200) + ',' + Math.floor(Math.random()*200) + ',' + Math.floor(Math.random()*200) + ')';
            ctx.beginPath();
            ctx.moveTo(Math.random() * 120, Math.random() * 40);
            ctx.lineTo(Math.random() * 120, Math.random() * 40);
            ctx.stroke();
        }
    }
    generateCaptcha();
    $('#captchaCanvas').click(function() {
        generateCaptcha();
    });
});
</script>
</body>
</html>
