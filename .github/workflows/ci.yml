name: Java CI

# 每次 push / 合并请求都自动：编译 + 运行单元测试 + 打包，
# 避免"本地能跑、提交就坏"的回归（示例：报表 SQL 聚合、订单事务等核心逻辑改动）。
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile & run unit tests
        # 单元测试为纯 Mockito/JUnit5，无需启动 Spring 上下文，不依赖 MySQL/Redis
        run: mvn -B verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ylgj-jar
          path: target/*.jar
        if: success()
