<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C6BAD;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <!-- 装饰 -->
  <circle cx="340" cy="60" r="70" fill="rgba(255,255,255,0.06)"/>
  <circle cx="60" cy="240" r="50" fill="rgba(255,255,255,0.05)"/>
  <!-- 公文包 -->
  <rect x="160" y="85" width="80" height="60" rx="8" fill="rgba(255,255,255,0.9)"/>
  <rect x="185" y="75" width="30" height="15" rx="6" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="4"/>
  <rect x="192" y="105" width="16" height="10" rx="3" fill="#4A90D9"/>
  <!-- 对勾标记 -->
  <circle cx="225" cy="130" r="14" fill="#27AE60"/>
  <polyline points="218,130 223,135 233,125" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 听诊器 -->
  <path d="M170 155 Q170 145, 180 145" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="160" r="6" fill="rgba(255,255,255,0.6)"/>
  <!-- 文字 -->
  <text x="200" y="215" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="bold" fill="white">入职体检</text>
  <text x="200" y="243" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">安心入职 健康无忧</text>
</svg>
