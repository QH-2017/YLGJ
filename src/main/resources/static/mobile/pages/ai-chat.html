<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0,user-scalable=no,minimal-ui">
    <link rel="icon" href="../img/icon01.png">
    <title>AI健康助手 - 医疗管家</title>
    <link rel="stylesheet" href="../css/page-health-login.css" />
    <script>var API_BASE_URL = window.location.origin;</script>
    <script src="../plugins/jquery/dist/jquery.min.js"></script>
    <script src="../plugins/healthmobile.js"></script>
    <script src="../plugins/vue/vue.js"></script>
    <script src="../plugins/vue/axios-0.18.0.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: linear-gradient(135deg, #26C6DA, #00ACC1); padding: 14px 16px; display: flex; align-items: center; color: white; flex-shrink: 0; }
        .chat-header .back { font-size: 20px; margin-right: 10px; cursor: pointer; }
        .chat-header .title { font-size: 17px; font-weight: bold; }
        .chat-header .sub { font-size: 11px; opacity: 0.8; margin-left: 8px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 12px; background: #f0f2f5; }
        .msg { margin-bottom: 12px; display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { flex-direction: row-reverse; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .msg.ai .msg-avatar { background: linear-gradient(135deg, #26C6DA, #00ACC1); color: white; }
        .msg.user .msg-avatar { background: #2196F3; color: white; }
        .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; margin: 0 8px; line-height: 1.6; font-size: 14px; word-break: break-word; white-space: pre-wrap; }
        .msg.ai .msg-bubble { background: white; color: #333; border: 1px solid #e8e8e8; border-top-left-radius: 4px; }
        .msg.user .msg-bubble { background: #2196F3; color: white; border-top-right-radius: 4px; }
        .typing { display: flex; align-items: center; padding: 10px 14px; background: white; border: 1px solid #e8e8e8; border-radius: 12px; border-top-left-radius: 4px; margin-left: 44px; margin-bottom: 12px; width: fit-content; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: 0s; } .dot:nth-child(2) { animation-delay: 0.2s; } .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
        .quick-bar { padding: 8px 12px; background: white; border-top: 1px solid #eee; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0; }
        .quick-bar .qbtn { white-space: nowrap; padding: 5px 12px; border: 1px solid #ddd; border-radius: 15px; font-size: 12px; color: #666; cursor: pointer; flex-shrink: 0; }
        .quick-bar .qbtn:active { border-color: #26C6DA; color: #26C6DA; }
        .input-bar { display: flex; padding: 10px 12px; background: white; border-top: 1px solid #eee; gap: 8px; flex-shrink: 0; }
        .input-bar input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; }
        .input-bar input:focus { border-color: #26C6DA; }
        .input-bar button { padding: 10px 18px; background: linear-gradient(135deg, #26C6DA, #00ACC1); color: white; border: none; border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .input-bar button:disabled { opacity: 0.5; }
        .welcome { text-align: center; padding: 40px 20px; color: #999; }
        .welcome .icon { font-size: 48px; margin-bottom: 10px; }
        .welcome .title { font-size: 16px; color: #333; margin-bottom: 6px; }
        .welcome .desc { font-size: 13px; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="chat-header">
        <span class="back" onclick="history.go(-1)">‹</span>
        <span class="title">🤖 小医</span>
        <span class="sub">AI健康助手</span>
    </div>
    <div class="chat-messages" ref="msgBox">
        <div class="welcome" v-if="msgs.length === 0">
            <div class="icon">🏥</div>
            <div class="title">您好！我是小医</div>
            <div class="desc">我可以帮您了解体检项目、推荐套餐、解答健康疑问</div>
        </div>
        <div v-for="(m, i) in msgs" :key="i" class="msg" :class="m.role">
            <div class="msg-avatar"><span v-if="m.role==='ai'">🤖</span><span v-else>👤</span></div>
            <div class="msg-bubble">{{m.content}}</div>
        </div>
        <div v-if="loading" class="typing">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>
    <div class="quick-bar" v-if="msgs.length === 0">
        <span class="qbtn" @click="quick('推荐适合我的体检套餐')">推荐体检套餐</span>
        <span class="qbtn" @click="quick('血常规检查有什么意义')">血常规意义</span>
        <span class="qbtn" @click="quick('如何预约体检')">预约指南</span>
        <span class="qbtn" @click="quick('肿瘤筛查有哪些项目')">肿瘤筛查</span>
    </div>
    <div class="input-bar">
        <input v-model="input" @keydown.enter.prevent="send" placeholder="请输入健康问题..." :disabled="loading">
        <button @click="send" :disabled="loading || !input.trim()">发送</button>
    </div>
</div>
<script>
axios.defaults.baseURL = API_BASE_URL;
new Vue({
    el: '#app',
    data: { msgs: [], input: '', loading: false },
    methods: {
        send: function() {
            var txt = this.input.trim();
            if (!txt || this.loading) return;
            this.msgs.push({ role: 'user', content: txt });
            this.input = '';
            this.loading = true;
            this.scroll();
            var self = this;
            axios.post('/ai/chat', { message: txt }).then(function(res) {
                self.loading = false;
                if (res.data.flag) {
                    self.msgs.push({ role: 'ai', content: res.data.data });
                } else {
                    self.msgs.push({ role: 'ai', content: '抱歉：' + res.data.message });
                }
                self.scroll();
            }).catch(function() {
                self.loading = false;
                self.msgs.push({ role: 'ai', content: '网络连接异常，请稍后重试' });
                self.scroll();
            });
        },
        quick: function(txt) { this.input = txt; this.send(); },
        scroll: function() {
            var self = this;
            this.$nextTick(function() { var el = self.$refs.msgBox; if (el) el.scrollTop = el.scrollHeight; });
        }
    }
});
</script>
</body>
</html>
