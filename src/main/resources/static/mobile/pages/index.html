                <div class="img-parent">
                    <img src="../img/asset-ad.png" width="100%" height="100%" />
                </div>
            </div>
        </div>
        <script>
            $(function() {
                var ht = $('.banner-item').find('img').eq(0).height()
                var tg = $('.banner-item .item');
                var num = 0;
                for (i = 0; i < tg.length; i++) {
                    $('.indicators').append('<span></span>');
                    $('.indicators').find('span').eq(num).addClass('active');
                }
                $(".banner-item,.banner-roll").css('height', ht)

                function roll() {
                    tg.eq(num).animate({
                        'opacity': '1',
                        'z-index': num
                    }, 2000).siblings().animate({
                        'opacity': '0',
                        'z-index': 0
                    }, 2000);
                    $('.indicators').find('span').eq(num).addClass('active').siblings().removeClass('active');
                    if (num >= tg.length - 1) {
                        num = 0;
                    } else {
                        num++;
                    }
                }
                $('.indicators').find('span').click(function() {
                    num = $(this).index();
                    roll();
                });
                var timer = setInterval(roll, 3000);
                $('.banner-item').mouseover(function() {
                    clearInterval(timer)
                });
                $('.banner-item').mouseout(function() {
                    timer = setInterval(roll, 3000)
                });
            })
            $(window).resize(function() {
                var ht = $('.banner-item').find('img').eq(0).height()
                $(".banner-item,.banner-roll").css('height', ht)
            });
            
            // 检查登录状态，更新头部显示
            (function() {
                var userName = localStorage.getItem('userName');
                var userId = localStorage.getItem('userId');
                if (userName && userId) {
                    $('#headerRight').html(
                        '<a href="profile.html" style="color:#fff;font-size:14px;text-decoration:none;display:flex;align-items:center;">' +
                        '<i class="icon-person" style="margin-right:4px;font-size:16px;"></i>' + userName + '</a>'
                    );
                }
            })();
        </script>
