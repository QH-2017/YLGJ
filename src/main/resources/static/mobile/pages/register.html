<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0,user-scalable=no,minimal-ui">
    <link rel="icon" href="../img/icon01.png">
    <title>注册 - 医疗管家</title>
    <script>var API_BASE_URL = window.location.origin;</script>
    <script src="../plugins/jquery/dist/jquery.min.js"></script>
    <script src="../plugins/healthmobile.js"></script>
    <script src="../plugins/vue/vue.js"></script>
    <script src="../plugins/vue/axios-0.18.0.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f4f8; min-height: 100vh; }
        
        /* 顶部渐变头部 */
        .header { background: linear-gradient(135deg, #00897B 0%, #26A69A 50%, #4DB6AC 100%); padding: 20px 16px 50px; position: relative; }
        .header::after { content: ''; position: absolute; bottom: -25px; left: 0; right: 0; height: 50px; background: #f0f4f8; border-radius: 25px 25px 0 0; }
        .header .back { position: absolute; top: 12px; left: 12px; color: white; font-size: 22px; text-decoration: none; padding: 8px; z-index: 2; }
        .header .logo { text-align: center; position: relative; z-index: 1; }
        .header .logo-icon { width: 64px; height: 64px; border-radius: 20px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 32px; border: 2px solid rgba(255,255,255,0.3); }
        .header .title { color: white; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        .header .subtitle { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 4px; }

        /* 表单卡片 */
        .form-card { background: white; margin: -15px 16px 16px; border-radius: 16px; padding: 24px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; z-index: 1; }
        .form-card .card-title { font-size: 17px; font-weight: 600; color: #1a1a2e; margin-bottom: 20px; text-align: center; }

        /* 输入框组 */
        .input-group { margin-bottom: 16px; position: relative; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
        .input-group label .required { color: #F44336; margin-left: 2px; }
        .input-wrapper { display: flex; align-items: center; border: 1.5px solid #e8edf2; border-radius: 10px; padding: 0 14px; transition: all 0.3s; background: #fafbfc; }
        .input-wrapper:focus-within { border-color: #26A69A; background: #f0faf8; box-shadow: 0 0 0 3px rgba(38,166,154,0.1); }
        .input-wrapper .icon { font-size: 18px; margin-right: 10px; opacity: 0.5; flex-shrink: 0; }
        .input-wrapper input { flex: 1; border: none; outline: none; padding: 12px 0; font-size: 14px; background: transparent; color: #333; }
        .input-wrapper input::placeholder { color: #bbb; }

        /* 验证码行 */
        .captcha-row { display: flex; gap: 12px; align-items: center; }
        .captcha-row .input-wrapper { flex: 1; }
        .captcha-canvas { width: 110px; height: 44px; border-radius: 10px; cursor: pointer; flex-shrink: 0; border: 1.5px solid #e8edf2; transition: border-color 0.3s; }
        .captcha-canvas:active { border-color: #26A69A; }

        /* 性别选择 */
        .gender-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .gender-btn { flex: 1; padding: 10px; border: 1.5px solid #e8edf2; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.3s; background: #fafbfc; font-size: 14px; }
        .gender-btn.active { border-color: #26A69A; background: #e0f2f1; color: #00897B; font-weight: 600; }
        .gender-btn .icon { font-size: 18px; display: block; margin-bottom: 2px; }

        /* 注册按钮 */
        .register-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; background: linear-gradient(135deg, #00897B, #26A69A); color: white; letter-spacing: 2px; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,137,123,0.3); }
        .register-btn:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(0,137,123,0.3); }
        .register-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 底部链接 */
        .footer-link { text-align: center; margin-top: 18px; }
        .footer-link a { color: #26A69A; font-size: 14px; text-decoration: none; font-weight: 500; }
        .footer-link a:active { opacity: 0.7; }

        /* 协议提示 */
        .agreement { text-align: center; margin-top: 14px; font-size: 11px; color: #aaa; line-height: 1.6; }
        .agreement a { color: #26A69A; text-decoration: none; }

        /* 加载动画 */
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
    </style>
</head>
<body>
<div id="app">
    <!-- 顶部头部 -->
    <div class="header">
        <a class="back" href="login.html">‹</a>
        <div class="logo">
            <div class="logo-icon">🏥</div>
            <div class="title">创建账号</div>
            <div class="subtitle">加入医疗管家，开启健康管理之旅</div>
        </div>
    </div>

    <!-- 注册表单卡片 -->
    <div class="form-card">
        <div class="card-title">📋 填写注册信息</div>

        <div class="input-group">
            <label>用户名 <span class="required">*</span></label>
            <div class="input-wrapper">
                <span class="icon">👤</span>
                <input v-model="form.username" type="text" placeholder="3-20个字符" maxlength="20">
            </div>
        </div>

        <div class="input-group">
            <label>手机号 <span class="required">*</span></label>
            <div class="input-wrapper">
                <span class="icon">📱</span>
                <input v-model="form.phone" type="tel" placeholder="请输入11位手机号" maxlength="11">
            </div>
        </div>

        <div class="input-group">
            <label>性别 <span class="required">*</span></label>
            <div class="gender-row">
                <div class="gender-btn" :class="{active: form.gender === '1'}" @click="form.gender='1'">
                    <span class="icon">👨</span> 男
                </div>
                <div class="gender-btn" :class="{active: form.gender === '2'}" @click="form.gender='2'">
                    <span class="icon">👩</span> 女
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>身份证号 <span class="required">*</span></label>
            <div class="input-wrapper">
                <span class="icon">🪪</span>
                <input v-model="form.idCard" type="text" placeholder="请输入18位身份证号" maxlength="18">
            </div>
        </div>

        <div class="input-group">
            <label>密码 <span class="required">*</span></label>
            <div class="input-wrapper">
                <span class="icon">🔒</span>
                <input v-model="form.password" type="password" placeholder="至少6位，包含字母和数字">
            </div>
        </div>

        <div class="input-group">
            <label>确认密码 <span class="required">*</span></label>
            <div class="input-wrapper">
                <span class="icon">🔐</span>
                <input v-model="form.confirmPassword" type="password" placeholder="请再次输入密码">
            </div>
        </div>

        <div class="input-group">
            <label>验证码 <span class="required">*</span></label>
            <div class="captcha-row">
                <div class="input-wrapper">
                    <span class="icon">🔢</span>
                    <input v-model="captchaInput" type="text" placeholder="请输入验证码" maxlength="4">
                </div>
                <canvas id="captchaCanvas" class="captcha-canvas" width="110" height="44" @click="generateCaptcha"></canvas>
            </div>
        </div>

        <button class="register-btn" @click="register" :disabled="loading">
            <span v-if="loading"><span class="loading-spinner"></span>注册中...</span>
            <span v-else>注 册</span>
        </button>

        <div class="footer-link">
            <a href="login.html">已有账号？返回登录</a>
        </div>

        <div class="agreement">
            注册即表示同意 <a href="javascript:void(0)">《用户协议》</a> 和 <a href="javascript:void(0)">《隐私政策》</a>
        </div>
    </div>
</div>
<script>
axios.defaults.baseURL = API_BASE_URL;
var captchaCode = '';

function generateCaptcha() {
    var canvas = document.getElementById('captchaCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var chars = 'ABCDEFGHJKMNPQRSTWXYZabcdefhjkmnprstwxyz2345678';
    captchaCode = '';
    for (var i = 0; i < 4; i++) {
        captchaCode += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    // 背景渐变
    var grd = ctx.createLinearGradient(0, 0, 110, 44);
    grd.addColorStop(0, '#e8f5e9');
    grd.addColorStop(1, '#c8e6c9');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, 110, 44);
    // 干扰线
    for (var i = 0; i < 6; i++) {
        ctx.strokeStyle = 'rgba(' + Math.floor(Math.random()*150+100) + ',' + Math.floor(Math.random()*150+100) + ',' + Math.floor(Math.random()*150+100) + ',0.4)';
        ctx.beginPath();
        ctx.moveTo(Math.random() * 110, Math.random() * 44);
        ctx.lineTo(Math.random() * 110, Math.random() * 44);
        ctx.stroke();
    }
    // 验证码文字
    var colors = ['#00897B', '#1565C0', '#C62828', '#6A1B9A', '#E65100'];
    for (var i = 0; i < 4; i++) {
        ctx.font = (Math.floor(Math.random() * 4 + 22)) + 'px "Arial Black", Arial';
        ctx.fillStyle = colors[i];
        ctx.save();
        ctx.translate(18 + i * 24, 30);
        ctx.rotate((Math.random() - 0.5) * 0.4);
        ctx.fillText(captchaCode[i], 0, 0);
        ctx.restore();
    }
    // 干扰点
    for (var i = 0; i < 30; i++) {
        ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.15) + ')';
        ctx.beginPath();
        ctx.arc(Math.random() * 110, Math.random() * 44, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

new Vue({
    el: '#app',
    data: {
        form: { username: '', phone: '', idCard: '', password: '', confirmPassword: '', gender: '1' },
        captchaInput: '',
        loading: false
    },
    mounted: function() {
        generateCaptcha();
    },
    methods: {
        register: function() {
            var f = this.form;
            if (!f.username || f.username.trim().length < 3) {
                alert('用户名至少3个字符'); return;
            }
            if (!f.phone || !/^1[3-9]\d{9}$/.test(f.phone)) {
                alert('请输入正确的手机号'); return;
            }
            if (!f.idCard || !/^\d{17}[\dXx]$/.test(f.idCard)) {
                alert('请输入正确的18位身份证号'); return;
            }
            if (!f.password || f.password.length < 6) {
                alert('密码至少6位'); return;
            }
            if (f.password !== f.confirmPassword) {
                alert('两次密码不一致'); return;
            }
            if (!this.captchaInput) {
                alert('请输入验证码'); return;
            }
            if (this.captchaInput.toLowerCase() !== captchaCode.toLowerCase()) {
                alert('验证码错误'); generateCaptcha(); return;
            }
            var self = this;
            self.loading = true;
            axios.post('/user/register', {
                username: f.username.trim(),
                password: f.password,
                telephone: f.phone,
                gender: f.gender
            }).then(function(res) {
                self.loading = false;
                if (res.data.flag) {
                    alert('注册成功！请登录');
                    window.location.href = 'login.html';
                } else {
                    alert(res.data.message || '注册失败');
                    generateCaptcha();
                }
            }).catch(function() {
                self.loading = false;
                alert('网络错误，请稍后重试');
                generateCaptcha();
            });
        }
    }
});
</script>
</body>
</html>
