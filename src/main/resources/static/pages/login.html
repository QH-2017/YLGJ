<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>医疗管家 - 登录</title>
    <meta name="description" content="医疗管家登录系统">
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
    <!-- 引入样式 -->
    <link rel="stylesheet" href="/static/plugins/elementui/index.css">
    <link rel="stylesheet" href="/static/plugins/font-awesome/css/font-awesome.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        .login-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a6b4a 0%, #2d9b6e 30%, #43b88c 60%, #6ecda8 100%);
            position: relative;
            overflow: hidden;
        }
        .login-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 20%, rgba(255,255,255,0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        .login-card {
            width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 48px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }
        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }
        .login-logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d9b6e, #43b88c);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(45, 155, 110, 0.35);
        }
        .login-logo i {
            font-size: 34px;
            color: #fff;
        }
        .login-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a6b4a;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 13px;
            color: #999;
            letter-spacing: 1px;
        }
        .login-form {
            margin-top: 8px;
        }
        .login-form .el-input {
            margin-bottom: 22px;
        }
        .login-form .el-input__inner {
            height: 44px;
            line-height: 44px;
            border-radius: 8px;
            font-size: 14px;
            border-color: #e0e0e0;
            transition: all 0.3s;
        }
        .login-form .el-input__inner:focus {
            border-color: #2d9b6e;
            box-shadow: 0 0 0 3px rgba(45, 155, 110, 0.12);
        }
        .login-form .el-input__prefix {
            left: 12px;
            color: #aaa;
        }
        .login-form .el-input__prefix i {
            font-size: 18px;
        }
        .login-form .el-input__inner {
            padding-left: 40px;
        }
        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .login-btn {
            width: 100%;
            height: 46px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 6px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2d9b6e, #43b88c);
            border: none;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(45, 155, 110, 0.35);
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #1a6b4a, #2d9b6e);
            box-shadow: 0 6px 24px rgba(45, 155, 110, 0.45);
            transform: translateY(-1px);
        }
        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(45, 155, 110, 0.3);
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #bbb;
        }
        .el-checkbox__input.is-checked .el-checkbox__inner {
            background-color: #2d9b6e;
            border-color: #2d9b6e;
        }
        .el-checkbox__input.is-checked + .el-checkbox__label {
            color: #666;
        }
        /* 动画 */
        .login-card {
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 装饰元素 */
        .decoration-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            z-index: 0;
        }
        .decoration-circle.c1 {
            width: 300px; height: 300px;
            top: -80px; right: -60px;
        }
        .decoration-circle.c2 {
            width: 200px; height: 200px;
            bottom: -50px; left: -40px;
        }
        .decoration-circle.c3 {
            width: 120px; height: 120px;
            top: 40%; left: 8%;
            background: rgba(255,255,255,0.04);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-wrapper">
            <div class="decoration-circle c1"></div>
            <div class="decoration-circle c2"></div>
            <div class="decoration-circle c3"></div>

            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <i class="fa fa-heartbeat"></i>
                    </div>
                    <div class="login-title">医疗管家</div>
                    <div class="login-subtitle">Medical Management System</div>
                </div>

                <el-form :model="loginForm" :rules="rules" ref="loginForm" class="login-form" @submit.native.prevent="handleLogin">
                    <el-form-item prop="username">
                        <el-input
                            v-model="loginForm.username"
                            placeholder="请输入用户名"
                            prefix-icon="fa fa-user"
                            clearable
                            @keyup.enter.native="handleLogin">
                        </el-input>
                    </el-form-item>
                    <el-form-item prop="password">
                        <el-input
                            v-model="loginForm.password"
                            type="password"
                            placeholder="请输入密码"
                            prefix-icon="fa fa-lock"
                            show-password
                            @keyup.enter.native="handleLogin">
                        </el-input>
                    </el-form-item>
                </el-form>

                <div class="login-options">
                    <el-checkbox v-model="rememberMe">记住密码</el-checkbox>
                </div>

                <button class="login-btn" @click="handleLogin" :loading="loading">
                    <span v-if="!loading">登 录</span>
                    <span v-else>登录中...</span>
                </button>

                <div class="login-footer">
                    <span style="margin-right:15px;"><a href="register.html" style="color:#2d9b6e;text-decoration:none;font-weight:500;">注册新账号</a></span>
                    Copyright &copy; 2026 医疗管家 版权所有
                </div>
            </div>
        </div>
    </div>

    <!-- 引入组件库 -->
    <script src="/static/js/vue.js"></script>
    <script src="/static/plugins/elementui/index.js"></script>
    <script src="/static/js/axios-0.18.0.js"></script>
    <script type="text/javascript">
        // 页面加载时检查本地保存的账号密码
        var savedUser = localStorage.getItem('medical_admin_user');
        var savedPass = localStorage.getItem('medical_admin_pass');

        var vue = new Vue({
            el: '#app',
            data: {
                loginForm: {
                    username: savedUser || '',
                    password: savedPass || ''
                },
                rememberMe: !!savedUser,
                loading: false,
                rules: {
                    username: [
                        { required: true, message: '请输入用户名', trigger: 'blur' }
                    ],
                    password: [
                        { required: true, message: '请输入密码', trigger: 'blur' }
                    ]
                }
            },
            methods: {
                handleLogin: function () {
                    var self = this;
                    self.$refs.loginForm.validate(function (valid) {
                        if (!valid) {
                            return false;
                        }
                        self.loading = true;
                        axios.post('/user/login', {
                            username: self.loginForm.username,
                            password: self.loginForm.password
                        }).then(function (res) {
                            self.loading = false;
                            if (res.data.flag) {
                                // 登录成功
                                if (self.rememberMe) {
                                    localStorage.setItem('medical_admin_user', self.loginForm.username);
                                    localStorage.setItem('medical_admin_pass', self.loginForm.password);
                                } else {
                                    localStorage.removeItem('medical_admin_user');
                                    localStorage.removeItem('medical_admin_pass');
                                }
                                self.$message.success('登录成功');
                                window.location.href = 'main.html?username=' + encodeURIComponent(self.loginForm.username);
                            } else {
                                self.$message.error(res.data.message || '用户名或密码错误');
                            }
                        }).catch(function (err) {
                            self.loading = false;
                            self.$message.error('登录请求失败，请检查网络或服务器');
                            console.error('登录请求异常:', err);
                        });
                    });
                }
            }
        });
    </script>
</body>
</html>
