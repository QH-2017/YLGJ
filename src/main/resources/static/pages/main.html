<!DOCTYPE html>
<html>
<head>
    <!-- 页面meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>医疗管家</title>
    <meta name="description" content="医疗管家">
    <meta name="keywords" content="医疗管家">
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
    <!-- 引入样式 -->
    <link rel="stylesheet" href="/static/plugins/elementui/index.css">
    <link rel="stylesheet" href="/static/plugins/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style type="text/css">
    .el-main{
        position: absolute;
        top: 70px;
        bottom: 0px;
        left: 200px;
        right: 10px;
        padding: 0;
    }
    </style>
</head>
<body class="hold-transition skin-purple sidebar-mini">
    <div id="app">
        <el-container>
            <el-header  class="main-header" style="height:90px;">
                <nav class="navbar navbar-static-top" :class=''>
                    <!-- Logo -->
                    <a href="#" class="logo" style="text-align:center">
                        <span class="logo-lg"><img src="/static/img/logo001.png" width="140"></span>
                    </a>
                    <div class="right-menu">
                        <span class="help"><i class="fa fa-exclamation-circle" aria-hidden="true"></i>帮助</span>
                        <el-dropdown class="avatar-container right-menu-item" trigger="click" @command="handleCommand">
                            <div class="avatar-wrapper">
                                <img src="/static/img/user2-160x160.jpg" class="user-avatar">
                                {{ username }}
                            </div>
                            <el-dropdown-menu slot="dropdown">
                                <el-dropdown-item divided command="profile">
                                    <span style="display:block;"><i class="fa fa-user"></i> 个人中心</span>
                                </el-dropdown-item>
                                <el-dropdown-item divided command="password">
                                    <span style="display:block;"><i class="fa fa-lock"></i> 修改密码</span>
                                </el-dropdown-item>
                                <el-dropdown-item divided command="logout">
                                    <span style="display:block;"><i class="fa fa-sign-out"></i> 退出登录</span>
                                </el-dropdown-item>
                            </el-dropdown-menu>
                        </el-dropdown>
                    </div>
                </nav>
            </el-header>
            <el-container>
                <el-aside width="200px">
                    <el-menu>
                        <el-submenu v-for="menu in menuList" :index="menu.path">
                            <template slot="title">
                                <i class="fa" :class="menu.icon"></i>
                                {{menu.title}}
                            </template>
                            <template v-for="child in menu.children">
                                <el-menu-item :index="child.path">
                                    <a :href="child.linkUrl" target="right">{{child.title}}</a>
                                </el-menu-item>
                            </template>
                        </el-submenu>
                    </el-menu>
                </el-aside>
                <el-container>
                    <iframe name="right" class="el-main" src="report_business.html" width="100%" height="100%" frameborder="0"></iframe>
                </el-container>
            </el-container>
        </el-container>
    </div>
<!-- 引入组件库 -->
<script src="/static/js/vue.js"></script>
<script src="/static/plugins/elementui/index.js"></script>
<script type="text/javascript" src="/static/js/jquery.min.js"></script>
<script src="/static/js/axios-0.18.0.js"></script>
<script>
    new Vue({
        el: '#app',
        data:{
            menuList:[
                {
                    "path": "1",
                    "title": "工作列表",
                    "icon":"fa-dashboard",
                    "children": [
                        {
                            "path": "/1-1",
                            "title": "工作台",
                            "linkUrl":"dashboard.html",
                            "children":[]
                        }
                    ]
                },
                {
                    "path": "2",
                    "title": "会员管理",
                    "icon":"fa-user-md",
                    "children": [
                        {
                            "path": "/2-1",
                            "title": "会员档案管理",
                            "linkUrl":"member.html",
                            "children":[]
                        },
                        {
                            "path": "/2-2",
                            "title": "体检资料上传",
                            "linkUrl":"health-upload.html",
                            "children":[]
                        },
                        {
                            "path": "/2-3",
                            "title": "会员信息统计",
                            "linkUrl":"all-item-list.html",
                            "children":[]
                        }
                    ]
                },
                {
                    "path": "3",
                    "title": "预约管理",
                    "icon":"fa-tty",
                    "children": [
                        {
                            "path": "/3-1",
                            "title": "预约信息列表",
                            "linkUrl":"ordersettinglist.html",
                            "children":[]
                        },
                        {
                            "path": "/3-2",
                            "title": "预约条件设置",
                            "linkUrl":"ordersetting.html",
                            "children":[]
                        },
                        {
                            "path": "/3-3",
                            "title": "套餐信息管理",
                            "linkUrl":"setmeal.html",
                            "children":[]
                        },
                        {
                            "path": "/3-4",
                            "title": "检查组信息管理",
                            "linkUrl":"checkgroup.html",
                            "children":[]
                        },
                        {
                            "path": "/3-5",
                            "title": "检查项信息管理",
                            "linkUrl":"checkitem.html",
                            "children":[]
                        }
                    ]
                },
                {
                    "path": "4",
                    "title": "健康评测",
                    "icon":"fa-stethoscope",
                    "children":[
                        {
                            "path": "/4-1",
                            "title": "中医体质辨识",
                            "linkUrl":"all-medical-list.html",
                            "children":[]
                        }
                    ]
                },
                {
                    "path": "5",
                    "title": "统计分析",
                    "icon":"fa-heartbeat",
                    "children":[
                        {
                            "path": "/5-1",
                            "title": "工作量统计",
                            "linkUrl":"report_business.html",
                            "children":[]
                        },
                        {
                            "path": "/5-2",
                            "title": "会员统计",
                            "linkUrl":"report_member.html",
                            "children":[]
                        },
                        {
                            "path": "/5-3",
                            "title": "套餐预约统计",
                            "linkUrl":"report_setmeal.html",
                            "children":[]
                        }
                    ]
                },
                {
                    "path": "6",
                    "title": "AI智能助手",
                    "icon":"fa-robot",
                    "children":[
                        {
                            "path": "/6-1",
                            "title": "健康咨询助手",
                            "linkUrl":"ai-chat.html",
                            "children":[]
                        }
                    ]
                }
            ]
        },
        computed: {
            username: function() {
                return localStorage.getItem('username') || '管理员';
            }
        },
        created: function() {
            var urlParams = new URLSearchParams(window.location.search);
            var name = urlParams.get('username');
            if (name) {
                localStorage.setItem('username', name);
            }
        },
        methods: {
            handleCommand: function(command) {
                if (command === 'logout') {
                    localStorage.removeItem('username');
                    window.location.href = 'login.html';
                } else if (command === 'profile') {
                    window.location.href = 'profile.html';
                } else if (command === 'password') {
                    this.$message.info('修改密码功能开发中');
                }
            }
        }
    });
    $(function() {
        var wd = 200;
        $(".el-main").css('width', $('body').width() - wd + 'px');
    });
</script>
</body>
</html>
