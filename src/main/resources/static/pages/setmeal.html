<!DOCTYPE html>
<html>
    <head>
        <!-- 页面meta -->
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">
        <title>医疗管家</title>
        <meta name="description" content="医疗管家">
        <meta name="keywords" content="医疗管家">
        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
        <!-- 引入样式 -->
        <link rel="stylesheet" href="/static/plugins/elementui/index.css">
        <link rel="stylesheet" href="/static/plugins/font-awesome/css/font-awesome.min.css">
        <link rel="stylesheet" href="/static/css/style.css">
        <!-- 引入组件库 -->
        <script type="text/javascript" src="/static/js/jquery.min.js"></script>
        <script src="/static/js/vue.js"></script>
        <script src="/static/plugins/elementui/index.js"></script>
        <script src="/static/js/axios-0.18.0.js"></script>
        <style>
            .avatar-uploader .el-upload {
                border: 1px dashed #d9d9d9;
                border-radius: 6px;
                cursor: pointer;
                position: relative;
                overflow: hidden;
            }
            .avatar-uploader .el-upload:hover {
                border-color: #409EFF;
            }
            .avatar-uploader-icon {
                font-size: 28px;
                color: #8c939d;
                width: 178px;
                height: 178px;
                line-height: 178px;
                text-align: center;
            }
            .avatar {
                width: 178px;
                height: 178px;
                display: block;
            }
            .datatable {
                position: relative;
                box-sizing: border-box;
                -webkit-box-flex: 1;
                width: 100%;
                max-width: 100%;
                font-size: 14px;
                color: rgb(96, 98, 102);
                overflow: hidden;
                flex: 1 1 0%;
            }
            .datatable td, .datatable th {
                padding: 12px 0;
                min-width: 0;
                -webkit-box-sizing: border-box;
                box-sizing: border-box;
                text-overflow: ellipsis;
                vertical-align: middle;
                position: relative;
                text-align: left;
            }
        </style>
    </head>
    <body class="hold-transition">
        <div id="app">
            <div class="content-header">
                <h1>预约管理<small>套餐管理</small></h1>
                <el-breadcrumb separator-class="el-icon-arrow-right" class="breadcrumb">
                    <el-breadcrumb-item :to="{ path: '/' }">首页</el-breadcrumb-item>
                    <el-breadcrumb-item>预约管理</el-breadcrumb-item>
                    <el-breadcrumb-item>套餐管理</el-breadcrumb-item>
                </el-breadcrumb>
            </div>
            <div class="app-container">
                <div class="box">
                    <div class="filter-container">
                        <el-input placeholder="编码/名称/助记码" v-model="pagination.queryString" style="width: 200px;" class="filter-item" @keyup.enter.native="handleFilter"></el-input>
                        <el-button @click="findPage()" class="dalfBut">查询</el-button>
                        <el-button type="primary" class="butT" @click="handleCreate()">新建</el-button>
                    </div>
                    <el-table size="small" current-row-key="id" :data="dataList" stripe highlight-current-row>
                        <el-table-column type="index" align="center" label="序号"></el-table-column>
                        <el-table-column prop="code" label="套餐编码" align="center"></el-table-column>
                        <el-table-column prop="name" label="套餐名称" align="center"></el-table-column>
                        <el-table-column label="适用性别" align="center">
                            <template slot-scope="scope">
                                <span>{{ scope.row.sex == '0' ? '不限' : scope.row.sex == '1' ? '男' : '女'}}</span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="age" label="适用年龄" align="center"></el-table-column>
                        <el-table-column prop="helpCode" label="助记码" align="center"></el-table-column>
                        <el-table-column prop="remark" label="说明" align="center"></el-table-column>
                        <el-table-column label="操作" align="center" width="180" fixed="right">
                            <template slot-scope="scope">
                                <el-button type="primary" size="mini" icon="el-icon-edit" @click="handleUpdate(scope.row)">编辑</el-button>
                                <el-button size="mini" type="danger" icon="el-icon-delete" @click="handleDelete(scope.row)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                    <div class="pagination-container">
                        <el-pagination
                            class="pagiantion"
                            @current-change="handleCurrentChange"
                            :current-page="pagination.currentPage"
                            :page-size="pagination.pageSize"
                            layout="total, prev, pager, next, jumper"
                            :total="pagination.total">
                        </el-pagination>
                    </div>
                    <!-- 新增标签弹层 -->
                    <div class="add-form">
                        <el-dialog :title="isEdit ? '编辑套餐' : '新增套餐'" :visible.sync="dialogFormVisible">
                            <template>
                                <el-tabs v-model="activeName" type="card">
                                    <el-tab-pane label="基本信息" name="first">
                                        <el-form ref="dataAddForm" :model="formData" :rules="formRules" label-position="right" label-width="100px">
                                            <el-row>
                                                <el-col :span="12">
                                                    <el-form-item label="编码" prop="code">
                                                        <el-input v-model="formData.code"/>
                                                    </el-form-item>
                                                </el-col>
                                                <el-col :span="12">
                                                    <el-form-item label="名称" prop="name">
                                                        <el-input v-model="formData.name"/>
                                                    </el-form-item>
                                                </el-col>
                                            </el-row>
                                            <el-row>
                                                <el-col :span="12">
                                                    <el-form-item label="适用性别" prop="sex">
                                                        <el-select v-model="formData.sex">
                                                            <el-option label="不限" value="0"></el-option>
                                                            <el-option label="男" value="1"></el-option>
                                                            <el-option label="女" value="2"></el-option>
                                                        </el-select>
                                                    </el-form-item>
                                                </el-col>
                                                <el-col :span="12">
                                                    <el-form-item label="助记码" prop="helpCode">
                                                        <el-input v-model="formData.helpCode"/>
                                                    </el-form-item>
                                                </el-col>
                                            </el-row>
                                            <el-row>
                                                <el-col :span="12">
                                                    <el-form-item label="套餐价格" prop="price">
                                                        <el-input v-model="formData.price"/>
                                                    </el-form-item>
                                                </el-col>
                                                <el-col :span="12">
                                                    <el-form-item label="适用年龄" prop="age">
                                                        <el-input v-model="formData.age"/>
                                                    </el-form-item>
                                                </el-col>
                                            </el-row>
                                            <el-row>
                                                <el-col :span="24">
                                                    <el-form-item label="上传图片">
                                                        <el-upload
                                                                class="avatar-uploader"
                                                                action="/setmeal/upload.do"
                                                                :auto-upload="autoUpload"
                                                                name="imgFile"
                                                                :show-file-list="false"
                                                                :on-success="handleAvatarSuccess"
                                                                :before-upload="beforeAvatarUpload">
                                                            <img v-if="imageUrl" :src="imageUrl" class="avatar">
                                                            <i v-else class="el-icon-plus avatar-uploader-icon"></i>
                                                        </el-upload>
                                                    </el-form-item>
                                                </el-col>
                                            </el-row>
                                            <el-row>
                                                <el-col :span="24">
                                                    <el-form-item label="说明">
                                                        <el-input v-model="formData.remark" type="textarea"></el-input>
                                                    </el-form-item>
                                                </el-col>
                                            </el-row>
                                            <el-row>
                                                <el-col :span="24">
                                                    <el-form-item label="注意事项">
                                                        <el-input v-model="formData.attention" type="textarea"></el-input>
                                                    </el-form-item>
                                                </el-col>
                                            </el-row>
                                        </el-form>
                                    </el-tab-pane>
                                    <el-tab-pane label="检查组信息" name="second">
										<div class="checkScrol">
											<table class="datatable">
												<thead>
												<tr>
													<th>选择</th>
													<th>项目编码</th>
													<th>项目名称</th>
													<th>项目说明</th>
												</tr>
												</thead>
												<tbody>
												<tr v-for="c in tableData">
													<td>
														<input :id="c.id" v-model="checkgroupIds" type="checkbox" :value="c.id">
													</td>
													<td><label :for="c.id">{{c.code}}</label></td>
													<td><label :for="c.id">{{c.name}}</label></td>
													<td><label :for="c.id">{{c.remark}}</label></td>
												</tr>
												</tbody>
											</table>
										</div>
                                    </el-tab-pane>
                                </el-tabs>
                            </template>
                            <div slot="footer" class="dialog-footer">
                                <el-button @click="dialogFormVisible = false">取消</el-button>
                                <el-button type="primary" @click="isEdit ? handleEdit() : handleAdd()">确定</el-button>
                            </div>
                        </el-dialog>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <script>
        var vue = new Vue({
            el: '#app',
            data:{
                autoUpload:true,//自动上传
                imageUrl:null,//模型数据，用于上传图片完成后图片预览
                activeName:'first',//添加/编辑窗口Tab标签名称
                pagination: {//分页相关属性
                    currentPage: 1,
                    pageSize:10,
                    total:0,
                    queryString:null,
                },
                dataList: [],//列表数据
                formData: {},//表单数据
                tableData:[],//添加表单窗口中检查组列表数据
                checkgroupIds:[],//添加表单窗口中检查组复选框对应id
                dialogFormVisible: false,//控制添加窗口显示/隐藏
                isEdit:false,//当前是新增还是编辑模式
                formRules: {//表单验证规则
                    code: [{ required: true, message: '请输入套餐编码', trigger: 'blur' }],
                    name: [{ required: true, message: '请输入套餐名称', trigger: 'blur' }],
                    sex: [{ required: true, message: '请选择适用性别', trigger: 'change' }],
                    price: [
                        { required: true, message: '请输入套餐价格', trigger: 'blur' },
                        { pattern: /^\d+(\.\d+)?$/, message: '价格必须是数字', trigger: 'blur' }
                    ],
                    age: [{ required: true, message: '请输入适用年龄', trigger: 'blur' }]
                }
            },
            created() {
                this.findPage();
                this.findAllCheckgroup();
            },
            methods: {
                //查询所有检查组
                findAllCheckgroup(){
                    axios.get("/checkgroup/findAll").then((res)=>{
                        if(res.data.flag){
                            this.tableData = res.data.data;
                        }
                    });
                },
                //文件上传成功后的钩子
                handleAvatarSuccess(response, file) {
                    if(response.flag){
                        this.imageUrl = response.data.url;
                        this.formData.img = response.data.url;
                    }else{
                        this.$message.error(response.message);
                    }
                },
                //上传图片之前执行
                beforeAvatarUpload(file) {
                    const isImage = file.type === 'image/jpeg' || file.type === 'image/png' || file.type === 'image/gif';
                    const isLt5M = file.size / 1024 / 1024 < 5;
                    if (!isImage) {
                        this.$message.error('上传套餐图片只能是 JPG/PNG/GIF 格式!');
                    }
                    if (!isLt5M) {
                        this.$message.error('上传套餐图片大小不能超过 5MB!');
                    }
                    return isImage && isLt5M;
                },
                //添加
                handleAdd () {
                    this.$refs['dataAddForm'].validate((valid)=>{
                        if(valid){
                            this.formData.checkgroupIds = this.checkgroupIds;
                            axios.post("/setmeal/add", this.formData).then((res)=>{
                                this.dialogFormVisible = false;
                                if(res.data.flag){
                                    this.$message.success(res.data.message);
                                    this.findPage();
                                }else{
                                    this.$message.error(res.data.message);
                                }
                            }).catch(()=>{
                                this.$message.error("请求失败，请检查输入数据是否正确");
                            });
                        }else{
                            this.$message.error("格式验证失败，请检查");
                        }
                    });
                },
                //分页查询
                findPage() {
                    var pageParam = {
                        currentPage:this.pagination.currentPage,
                        pageSize:this.pagination.pageSize,
                        queryString:this.pagination.queryString
                    };
                    axios.post("/setmeal/findPage", pageParam).then((res)=>{
                        this.dataList = res.data.rows;
                        this.pagination.total = res.data.total;
                    });
                },
                // 重置表单
                resetForm() {
                    this.formData = {};
                    this.checkgroupIds = [];
                    this.imageUrl = null;
                },
                // 弹出添加窗口
                handleCreate() {
                    this.dialogFormVisible = true;
                    this.isEdit = false;
                    this.resetForm();
                    this.activeName = 'first';
                },
                //切换页码
                handleCurrentChange(currentPage) {
                    this.pagination.currentPage = currentPage;
                    this.findPage();
                },
                // 弹出编辑窗口
                handleUpdate(row) {
                    this.dialogFormVisible = true;
                    this.isEdit = true;
                    this.activeName = 'first';
                    this.resetForm();
                    this.formData = JSON.parse(JSON.stringify(row));
                    if(row.setmealCheckGroups){
                        this.checkgroupIds = [];
                        row.setmealCheckGroups.forEach((item)=>{
                            this.checkgroupIds.push(item.checkgroupId);
                        });
                    }
                    this.imageUrl = row.img;
                },
                //编辑套餐
                handleEdit() {
                    this.$refs['dataAddForm'].validate((valid)=>{
                        if(valid){
                            this.formData.checkgroupIds = this.checkgroupIds;
                            axios.post('/setmeal/edit', this.formData).then((res)=>{
                                this.dialogFormVisible = false;
                                if(res.data.flag){
                                    this.$message.success(res.data.message);
                                    this.findPage();
                                }else{
                                    this.$message.error(res.data.message);
                                }
                            }).catch(()=>{
                                this.$message.error("请求失败，请检查输入数据是否正确");
                            });
                        }else{
                            this.$message.error('格式验证失败，请检查');
                        }
                    });
                },
                // 删除套餐
                handleDelete(row) {
                    this.$confirm('确定删除该套餐吗？', '提示', {
                        type: 'warning'
                    }).then(()=>{
                        axios.delete('/setmeal/deleteInfoById/' + row.id).then((res)=>{
                            if(res.data.flag){
                                this.$message.success(res.data.message);
                                this.findPage();
                            }else{
                                this.$message.error(res.data.message);
                            }
                        });
                    }).catch(()=>{
                        this.$message({
                            type: 'info',
                            message: '用户取消了该操作！'
                        });
                    });
                }
            }
        })
    </script>
</html>
