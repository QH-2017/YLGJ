<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>医疗管家</title>
    <link rel="stylesheet" href="/static/plugins/elementui/index.css">
    <link rel="stylesheet" href="/static/plugins/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .el-upload-dragger { width: 100%; }
        .file-list { margin-top: 20px; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .file-item:hover { border-color: #15b070; background: #f0faf5; }
        .file-info { display: flex; align-items: center; gap: 12px; }
        .file-icon { font-size: 28px; color: #15b070; }
        .file-name { font-size: 14px; color: #333; font-weight: 500; }
        .file-meta { font-size: 12px; color: #909399; margin-top: 4px; }
        .upload-area {
            border: 2px dashed #dcdfe6;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            background: #fafafa;
            transition: all 0.3s;
        }
        .upload-area:hover { border-color: #15b070; background: #f0faf5; }
        .upload-icon { font-size: 48px; color: #c0c4cc; margin-bottom: 15px; }
        .upload-text { color: #606266; font-size: 14px; }
        .upload-hint { color: #909399; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body class="hold-transition">
<div id="app">
    <div class="content-header">
        <h1>会员管理<small>体检资料上传</small></h1>
        <el-breadcrumb separator-class="el-icon-arrow-right" class="breadcrumb">
            <el-breadcrumb-item :to="{ path: '/' }">首页</el-breadcrumb-item>
            <el-breadcrumb-item>会员管理</el-breadcrumb-item>
            <el-breadcrumb-item>体检资料上传</el-breadcrumb-item>
        </el-breadcrumb>
    </div>
    <div class="app-container">
        <!-- 上传区域 -->
        <div class="upload-area" ref="uploadArea">
            <div class="upload-icon"><i class="fa fa-cloud-upload"></i></div>
            <div class="upload-text">将文件拖到此处，或 <label for="fileInput" style="color:#15b070;cursor:pointer;font-weight:500;">点击上传</label></div>
            <div class="upload-hint">支持 PDF、JPG、PNG、DOC、DOCX 格式，单个文件不超过 10MB</div>
            <input type="file" id="fileInput" ref="fileInput" style="display:none"
                   accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx"
                   multiple @change="handleFileSelect">
        </div>

        <!-- 文件描述 -->
        <el-card style="margin-top: 20px;" v-if="selectedFiles.length > 0">
            <div slot="header"><b>待上传文件 ({{ selectedFiles.length }}个)</b></div>
            <el-form label-width="100px" style="margin-bottom: 15px;">
                <el-form-item label="会员ID">
                    <el-input v-model="memberId" placeholder="请输入关联的会员ID（选填）" style="width: 300px;"></el-input>
                </el-form-item>
                <el-form-item label="文件说明">
                    <el-input v-model="description" type="textarea" :rows="2" placeholder="请输入文件说明（选填）"></el-input>
                </el-form-item>
            </el-form>
            <div v-for="(file, index) in selectedFiles" :key="index" class="file-item">
                <div class="file-info">
                    <span class="file-icon"><i class="fa" :class="getFileIcon(file.name)"></i></span>
                    <div>
                        <div class="file-name">{{ file.name }}</div>
                        <div class="file-meta">{{ formatSize(file.size) }}</div>
                    </div>
                </div>
                <el-button type="danger" size="mini" icon="el-icon-delete" @click="removeFile(index)">移除</el-button>
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <el-button @click="selectedFiles = []" :disabled="uploading">清空</el-button>
                <el-button type="primary" @click="uploadFiles" :loading="uploading">
                    {{ uploading ? '上传中...' : '开始上传' }}
                </el-button>
            </div>
        </el-card>

        <!-- 已上传文件列表 -->
        <el-card style="margin-top: 20px;">
            <div slot="header"><b>已上传的资料 ({{ uploadedFiles.length }})</b></div>
            <el-table :data="uploadedFiles" stripe v-if="uploadedFiles.length > 0">
                <el-table-column type="index" label="序号" width="80" align="center"></el-table-column>
                <el-table-column prop="fileName" label="文件名">
                    <template slot-scope="scope">
                        <span><i class="fa" :class="getFileIcon(scope.row.originalName)" style="margin-right:8px;color:#15b070;"></i>{{ scope.row.originalName }}</span>
                    </template>
                </el-table-column>
                <el-table-column prop="fileSize" label="大小" width="120" align="center">
                    <template slot-scope="scope">{{ formatSize(scope.row.fileSize) }}</template>
                </el-table-column>
                <el-table-column prop="uploadTime" label="上传时间" width="180" align="center"></el-table-column>
                <el-table-column label="操作" width="120" align="center">
                    <template slot-scope="scope">
                        <el-button type="primary" size="mini" icon="el-icon-download" @click="downloadFile(scope.row.savedName)">下载</el-button>
                        <el-button type="danger" size="mini" icon="el-icon-delete" @click="deleteFile(scope.row.savedName)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-empty description="暂无上传文件" v-else></el-empty>
        </el-card>
    </div>
</div>
<script src="/static/js/vue.js"></script>
<script src="/static/plugins/elementui/index.js"></script>
<script type="text/javascript" src="/static/js/jquery.min.js"></script>
<script src="/static/js/axios-0.18.0.js"></script>
<script>
new Vue({
    el: '#app',
    data: {
        selectedFiles: [],
        uploadedFiles: [],
        memberId: '',
        description: '',
        uploading: false
    },
    created() {
        this.loadUploadedFiles();
    },
    mounted() {
        // 拖拽上传
        var self = this;
        var area = this.$refs.uploadArea;
        area.addEventListener('dragover', function(e) { e.preventDefault(); area.style.borderColor = '#15b070'; });
        area.addEventListener('dragleave', function() { area.style.borderColor = '#dcdfe6'; });
        area.addEventListener('drop', function(e) {
            e.preventDefault();
            area.style.borderColor = '#dcdfe6';
            var files = e.dataTransfer.files;
            for (var i = 0; i < files.length; i++) {
                if (files[i].size <= 10 * 1024 * 1024) {
                    self.selectedFiles.push(files[i]);
                } else {
                    self.$message.warning(files[i].name + ' 超过10MB限制');
                }
            }
        });
    },
    methods: {
        handleFileSelect(e) {
            var files = e.target.files;
            for (var i = 0; i < files.length; i++) {
                if (files[i].size <= 10 * 1024 * 1024) {
                    this.selectedFiles.push(files[i]);
                } else {
                    this.$message.warning(files[i].name + ' 超过10MB限制');
                }
            }
            this.$refs.fileInput.value = '';
        },
        removeFile(index) {
            this.selectedFiles.splice(index, 1);
        },
        uploadFiles() {
            if (this.selectedFiles.length === 0) return;
            this.uploading = true;
            var self = this;
            var uploaded = 0;
            var total = this.selectedFiles.length;

            this.selectedFiles.forEach(function(file) {
                var formData = new FormData();
                formData.append('file', file);
                formData.append('memberId', self.memberId);
                formData.append('description', self.description);

                axios.post('/file/uploadHealthData', formData, {
                    headers: { 'Content-Type': 'multipart/form-data' }
                }).then(function(resp) {
                    uploaded++;
                    if (uploaded === total) {
                        self.uploading = false;
                        self.selectedFiles = [];
                        self.memberId = '';
                        self.description = '';
                        self.$message.success('所有文件上传成功！');
                        self.loadUploadedFiles();
                    }
                }).catch(function() {
                    uploaded++;
                    if (uploaded === total) {
                        self.uploading = false;
                        self.$message.error('部分文件上传失败');
                        self.loadUploadedFiles();
                    }
                });
            });
        },
        loadUploadedFiles() {
            var self = this;
            axios.get('/file/listHealthData').then(function(resp) {
                if (resp.data.flag) {
                    self.uploadedFiles = resp.data.data || [];
                }
            });
        },
        deleteFile(savedName) {
            var self = this;
            this.$confirm('确定删除该文件吗？', '提示', { type: 'warning' }).then(function() {
                axios.delete('/file/deleteHealthData/' + savedName).then(function(resp) {
                    if (resp.data.flag) {
                        self.$message.success('删除成功');
                        self.loadUploadedFiles();
                    } else {
                        self.$message.error('删除失败');
                    }
                });
            }).catch(function(){});
        },
        downloadFile(savedName) {
            window.location.href = '/file/downloadHealthData/' + savedName;
        },
        formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        },
        getFileIcon(name) {
            if (!name) return 'fa-file';
            var ext = name.split('.').pop().toLowerCase();
            if (ext === 'pdf') return 'fa-file-pdf-o';
            if (['jpg','jpeg','png','gif'].indexOf(ext) >= 0) return 'fa-file-image-o';
            if (['doc','docx'].indexOf(ext) >= 0) return 'fa-file-word-o';
            if (['xls','xlsx'].indexOf(ext) >= 0) return 'fa-file-excel-o';
            return 'fa-file';
        }
    }
});
</script>
</body>
</html>
