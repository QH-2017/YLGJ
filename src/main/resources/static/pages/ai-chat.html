<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>医疗管家</title>
    <link rel="stylesheet" href="/static/plugins/elementui/index.css">
    <link rel="stylesheet" href="/static/plugins/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 100px);
            max-width: 900px;
            margin: 0 auto;
            padding: 15px;
        }
        .chat-header {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #139589, #15b070);
            color: white;
            border-radius: 12px 12px 0 0;
            font-size: 16px;
        }
        .chat-header .ai-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f7fa;
            border-left: 1px solid #e4e7ed;
            border-right: 1px solid #e4e7ed;
        }
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .message.ai .message-avatar {
            background: linear-gradient(135deg, #139589, #15b070);
            color: white;
        }
        .message.user .message-avatar {
            background: #409EFF;
            color: white;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 0 12px;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e4e7ed;
            border-top-left-radius: 4px;
        }
        .message.user .message-content {
            background: #409EFF;
            color: white;
            border-top-right-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: white;
            border: 1px solid #e4e7ed;
            border-top: none;
            border-radius: 0 0 12px 12px;
            gap: 10px;
        }
        .chat-input-area textarea {
            flex: 1;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
            resize: none;
            height: 44px;
            max-height: 120px;
            outline: none;
            font-family: inherit;
        }
        .chat-input-area textarea:focus {
            border-color: #15b070;
        }
        .chat-input-area button {
            background: linear-gradient(135deg, #139589, #15b070);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 25px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .chat-input-area button:hover {
            opacity: 0.9;
        }
        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .quick-questions {
            padding: 10px 20px;
            background: white;
            border: 1px solid #e4e7ed;
            border-top: none;
        }
        .quick-questions span {
            font-size: 12px;
            color: #909399;
            margin-right: 10px;
        }
        .quick-btn {
            display: inline-block;
            padding: 4px 12px;
            margin: 3px;
            border: 1px solid #e4e7ed;
            border-radius: 15px;
            font-size: 12px;
            color: #606266;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quick-btn:hover {
            border-color: #15b070;
            color: #15b070;
        }
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e4e7ed;
            border-radius: 12px;
            border-top-left-radius: 4px;
            margin-left: 52px;
            margin-bottom: 20px;
            width: fit-content;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #c0c4cc;
            margin: 0 2px;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .welcome-tip {
            text-align: center;
            color: #909399;
            padding: 40px 20px;
            font-size: 13px;
        }
        .welcome-tip .welcome-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="hold-transition">
<div id="app">
    <div class="chat-container">
        <div class="chat-header">
            <span class="ai-avatar">🤖</span>
            小医 - AI健康助手
            <div style="font-size:12px;opacity:0.8;margin-top:5px;">基于 DeepSeek 大模型 · 为您提供专业健康咨询</div>
        </div>
        <div class="chat-messages" ref="chatMessages">
            <div class="welcome-tip" v-if="messages.length === 0">
                <div class="welcome-icon">🏥</div>
                <div style="font-size:16px;color:#333;margin-bottom:10px;">您好！我是小医，您的AI健康助手</div>
                <div>我可以帮您了解体检项目、推荐套餐、解答健康疑问</div>
            </div>
            <div v-for="(msg, index) in messages" :key="index" class="message" :class="msg.role">
                <div class="message-avatar">
                    <span v-if="msg.role === 'ai'">🤖</span>
                    <span v-else>👤</span>
                </div>
                <div class="message-content" v-html="formatMessage(msg.content)"></div>
            </div>
            <div v-if="loading" class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        <div class="quick-questions" v-if="messages.length === 0">
            <span>试试问：</span>
            <span class="quick-btn" @click="sendQuick('推荐适合我的体检套餐')">推荐体检套餐</span>
            <span class="quick-btn" @click="sendQuick('血常规检查有什么意义')">血常规意义</span>
            <span class="quick-btn" @click="sendQuick('如何预约体检')">预约指南</span>
            <span class="quick-btn" @click="sendQuick('肿瘤筛查有哪些项目')">肿瘤筛查</span>
        </div>
        <div class="chat-input-area">
            <textarea v-model="inputMessage" @keydown.enter.prevent="sendMessage" placeholder="请输入您的健康问题..." :disabled="loading"></textarea>
            <button @click="sendMessage" :disabled="loading || !inputMessage.trim()">
                <i class="fa fa-paper-plane"></i> 发送
            </button>
        </div>
    </div>
</div>
<script src="/static/js/vue.js"></script>
<script src="/static/plugins/elementui/index.js"></script>
<script type="text/javascript" src="/static/js/jquery.min.js"></script>
<script src="/static/js/axios-0.18.0.js"></script>
<script>
new Vue({
    el: '#app',
    data: {
        messages: [],
        inputMessage: '',
        loading: false
    },
    methods: {
        sendMessage() {
            var msg = this.inputMessage.trim();
            if (!msg || this.loading) return;

            this.messages.push({ role: 'user', content: msg });
            this.inputMessage = '';
            this.loading = true;
            this.scrollToBottom();

            axios.post('/ai/chat', { message: msg }).then(resp => {
                this.loading = false;
                if (resp.data.flag) {
                    this.messages.push({ role: 'ai', content: resp.data.data });
                } else {
                    this.messages.push({ role: 'ai', content: '抱歉，暂时无法回复：' + resp.data.message });
                }
                this.scrollToBottom();
            }).catch(err => {
                this.loading = false;
                this.messages.push({ role: 'ai', content: '抱歉，网络连接出现问题，请稍后重试。' });
                this.scrollToBottom();
            });
        },
        sendQuick(text) {
            this.inputMessage = text;
            this.sendMessage();
        },
        scrollToBottom() {
            var self = this;
            this.$nextTick(function() {
                var el = self.$refs.chatMessages;
                if (el) el.scrollTop = el.scrollHeight;
            });
        },
        formatMessage(text) {
            if (!text) return '';
            // 简单的 Markdown 转 HTML
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }
    }
});
</script>
</body>
</html>
