<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>医疗管家 - 工作台</title>
    <meta name="description" content="医疗管家工作台">
    <meta name="keywords" content="医疗管家,工作台,仪表盘">
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
    <link rel="stylesheet" href="/static/plugins/elementui/index.css">
    <link rel="stylesheet" href="/static/plugins/font-awesome/css/font-awesome.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        /* ===== Page Container ===== */
        .dashboard-page {
            padding: 24px 30px;
            min-height: 100vh;
        }

        /* ===== Header ===== */
        .dash-header {
            margin-bottom: 28px;
        }
        .dash-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .dash-header h1 .wave {
            display: inline-block;
            animation: wave 1.2s ease-in-out;
            transform-origin: 70% 70%;
        }
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            15% { transform: rotate(14deg); }
            30% { transform: rotate(-8deg); }
            45% { transform: rotate(14deg); }
            60% { transform: rotate(-4deg); }
            75% { transform: rotate(10deg); }
        }
        .dash-header .sub {
            font-size: 14px;
            color: #999;
        }

        /* ===== Stat Cards ===== */
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #f0f0f0;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: default;
            /* Animation: slide up + fade in */
            opacity: 0;
            transform: translateY(30px);
            animation: cardIn 0.5s ease forwards;
        }
        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.15s; }
        .stat-card:nth-child(3) { animation-delay: 0.25s; }
        .stat-card:nth-child(4) { animation-delay: 0.35s; }
        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.10);
        }
        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            flex-shrink: 0;
        }
        .stat-icon.green  { background: linear-gradient(135deg, #15b070, #1ad88e); }
        .stat-icon.teal   { background: linear-gradient(135deg, #139589, #20c5b6); }
        .stat-icon.orange  { background: linear-gradient(135deg, #f5a623, #f7c948); }
        .stat-icon.purple  { background: linear-gradient(135deg, #7c5ce0, #a78bfa); }
        .stat-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-label {
            font-size: 13px;
            color: #999;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.2;
        }

        /* ===== Quick Actions ===== */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i {
            color: #15b070;
        }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .action-card {
            background: #fff;
            border-radius: 10px;
            padding: 22px 16px;
            text-align: center;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            opacity: 0;
            transform: translateY(20px);
            animation: cardIn 0.5s ease forwards;
        }
        .action-card:nth-child(1) { animation-delay: 0.45s; }
        .action-card:nth-child(2) { animation-delay: 0.50s; }
        .action-card:nth-child(3) { animation-delay: 0.55s; }
        .action-card:nth-child(4) { animation-delay: 0.60s; }
        .action-card:nth-child(5) { animation-delay: 0.65s; }
        .action-card:nth-child(6) { animation-delay: 0.70s; }
        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(21, 176, 112, 0.15);
            border-color: #15b070;
        }
        .action-card .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
        }
        .action-card .action-icon.bg-green  { background: linear-gradient(135deg, #15b070, #1ad88e); }
        .action-card .action-icon.bg-teal   { background: linear-gradient(135deg, #139589, #20c5b6); }
        .action-card .action-icon.bg-orange  { background: linear-gradient(135deg, #f5a623, #f7c948); }
        .action-card .action-icon.bg-purple  { background: linear-gradient(135deg, #7c5ce0, #a78bfa); }
        .action-card .action-icon.bg-blue    { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
        .action-card .action-icon.bg-red     { background: linear-gradient(135deg, #ef4444, #f87171); }
        .action-card .action-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        /* ===== Loading ===== */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .stat-cards { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .stat-cards { grid-template-columns: 1fr; }
            .dashboard-page { padding: 16px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Loading -->
    <div class="loading-overlay" v-if="loading">
        <i class="fa fa-spinner fa-spin fa-3x" style="color:#15b070;"></i>
    </div>

    <div class="dashboard-page">
        <!-- Header -->
        <div class="dash-header">
            <h1><span class="wave">👋</span> 欢迎回来，管理员</h1>
            <p class="sub">医疗管家工作台 · {{today}}</p>
        </div>

        <!-- Stat Cards -->
        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fa fa-users"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">会员总数</span>
                    <span class="stat-value">{{stats.members}}</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon teal">
                    <i class="fa fa-calendar-check-o"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">今日预约</span>
                    <span class="stat-value">{{stats.todayOrders}}</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">
                    <i class="fa fa-user-plus"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">本周新增</span>
                    <span class="stat-value">{{stats.weekNew}}</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <i class="fa fa-heartbeat"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">体检套餐数</span>
                    <span class="stat-value">{{stats.setmeals}}</span>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="section-title"><i class="fa fa-th-large"></i> 快捷操作</div>
        <div class="quick-actions">
            <a class="action-card" href="member.html" target="right">
                <div class="action-icon bg-green"><i class="fa fa-user-md"></i></div>
                <div class="action-label">会员管理</div>
            </a>
            <a class="action-card" href="ordersettinglist.html" target="right">
                <div class="action-icon bg-teal"><i class="fa fa-tty"></i></div>
                <div class="action-label">预约列表</div>
            </a>
            <a class="action-card" href="setmeal.html" target="right">
                <div class="action-icon bg-orange"><i class="fa fa-list-alt"></i></div>
                <div class="action-label">套餐管理</div>
            </a>
            <a class="action-card" href="checkitem.html" target="right">
                <div class="action-icon bg-purple"><i class="fa fa-stethoscope"></i></div>
                <div class="action-label">检查项</div>
            </a>
            <a class="action-card" href="all-medical-list.html" target="right">
                <div class="action-icon bg-blue"><i class="fa fa-file-text-o"></i></div>
                <div class="action-label">健康评测</div>
            </a>
            <a class="action-card" href="ai-chat.html" target="right">
                <div class="action-icon bg-red"><i class="fa fa-robot"></i></div>
                <div class="action-label">AI 助手</div>
            </a>
        </div>
    </div>
</div>

<script src="/static/js/vue.js"></script>
<script src="/static/plugins/elementui/index.js"></script>
<script src="/static/js/axios-0.18.0.js"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            loading: true,
            today: '',
            stats: {
                members: 0,
                todayOrders: 0,
                weekNew: 0,
                setmeals: 0
            }
        },
        created: function () {
            this.setToday();
            this.loadStats();
        },
        methods: {
            setToday: function () {
                var d = new Date();
                var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                this.today = d.getFullYear() + '年' +
                    (d.getMonth() + 1) + '月' +
                    d.getDate() + '日 星期' +
                    weekdays[d.getDay()];
            },
            loadStats: function () {
                var self = this;
                var completed = 0;
                var total = 4;

                function checkDone() {
                    completed++;
                    if (completed >= total) {
                        self.loading = false;
                    }
                }

                // 会员总数
                axios.get('/member/findAll').then(function (res) {
                    var data = res.data.data || res.data;
                    if (Array.isArray(data)) {
                        self.stats.members = data.length;
                    } else if (data && data.total) {
                        self.stats.members = data.total;
                    }
                }).catch(function () {}).finally(checkDone);

                // 今日预约 — count orders whose date is today
                axios.get('/order/findAll').then(function (res) {
                    var list = res.data.data || res.data || [];
                    if (Array.isArray(list)) {
                        var todayStr = self.todayDateStr();
                        self.stats.todayOrders = list.filter(function (o) {
                            return o.orderDate && o.orderDate.indexOf(todayStr) === 0;
                        }).length;
                    }
                }).catch(function () {}).finally(checkDone);

                // 本周新增会员
                axios.get('/member/findAll').then(function (res) {
                    var list = res.data.data || res.data || [];
                    if (Array.isArray(list)) {
                        var weekAgo = new Date();
                        weekAgo.setDate(weekAgo.getDate() - 7);
                        self.stats.weekNew = list.filter(function (m) {
                            if (!m.regTime) return false;
                            return new Date(m.regTime) >= weekAgo;
                        }).length;
                    }
                }).catch(function () {}).finally(checkDone);

                // 体检套餐数
                axios.get('/setmeal/findAll').then(function (res) {
                    var data = res.data.data || res.data;
                    if (Array.isArray(data)) {
                        self.stats.setmeals = data.length;
                    } else if (data && data.total) {
                        self.stats.setmeals = data.total;
                    }
                }).catch(function () {}).finally(checkDone);
            },
            todayDateStr: function () {
                var d = new Date();
                var y = d.getFullYear();
                var m = ('0' + (d.getMonth() + 1)).slice(-2);
                var day = ('0' + d.getDate()).slice(-2);
                return y + '-' + m + '-' + day;
            }
        }
    });
</script>
</body>
</html>
